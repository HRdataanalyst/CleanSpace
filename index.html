'use strict';

const CLOUD_API_URL = 'https://script.google.com/macros/s/AKfycbwQFmxOo5XEA1ECYtPLywda8oEgrTJOx8jgGNiBlpw_HCr_5ZzjkswjRaMoB2-H_y-fIg/exec';
function cloudPublicCopy(obj){
  return JSON.parse(JSON.stringify(obj,(k,v)=> ((k==='before'||k==='after') && typeof v==='string' && v.startsWith('data:')) ? '' : v));
}
function cloudPost(msg){
  if (!CLOUD_API_URL) return;
  fetch(CLOUD_API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(cloudPublicCopy(msg))})
    .catch(e=>console.warn('CleanSpace cloud connection error:',e));
  // no-cors cannot confirm backend success. Verify the row in Sheets or reload Cloud.
}
let cloudLoading=false;
function loadCloud(){
  if (!CLOUD_API_URL || cloudLoading) return;
  cloudLoading=true;
  const name='csCloud'+Date.now()+Math.floor(Math.random()*99999);
  const tag=document.createElement('script');
  const clear=()=>{cloudLoading=false;delete window[name];tag.remove()};
  const timeout=setTimeout(()=>{clear();MAPPING_STATE='error';MAPPING_MESSAGE='โหลด Building Zone ไม่สำเร็จ (หมดเวลา)';render();notify(MAPPING_MESSAGE)},15000);
  window[name]=(response)=>{
    clearTimeout(timeout);clear();
    if(!response || !response.ok){MAPPING_STATE='error';MAPPING_MESSAGE='Google Sheets ยังไม่พร้อม: '+(response?.error||'ไม่ทราบสาเหตุ');render();notify(MAPPING_MESSAGE);return}
    function merged(a,b){const m=new Map(a.map(x=>[x.id,x]));for(const x of b){let prev=m.get(x.id);if(!prev||(x.history?.length||0)>=(prev.history?.length||0))m.set(x.id,x)}return Array.from(m.values())}
    try{applyBuildingZones(response.buildingZones)}catch(e){MAPPING_STATE='error';MAPPING_MESSAGE='โหลด Mapping ไม่ได้: '+e.message;}
    db.completed=merged(db.completed,response.completed||[]);
    db.tickets=merged(db.tickets,response.tickets||[]);
    db.actions=merged(db.actions,response.actions||[]);
    for(const k of Object.keys(db.drafts)){const d=db.drafts[k];if(!d?.startedAt||thaiDay(d.startedAt)!==thaiDay()||completedToday(d.building,d.floor))delete db.drafts[k]}
    save();render();notify(MAPPING_STATE==='ready'?'โหลดข้อมูลและ Building Zone จาก Google Sheets แล้ว':MAPPING_MESSAGE);
  };
  tag.onerror=()=>{clearTimeout(timeout);clear();MAPPING_STATE='error';MAPPING_MESSAGE='ไม่สามารถเชื่อม Building Zone ได้';render();notify(MAPPING_MESSAGE)};
  tag.src=CLOUD_API_URL+'?action=load&callback='+name+'&_='+Date.now();
  document.head.appendChild(tag);
}

// Mapping จาก Google Sheets แท็บ Building Zone เท่านั้น — ไม่ใช้ค่าอาคาร/ชั้นจำลอง
let BUILDINGS=[];
let MAPPING_STATE='loading';
let MAPPING_MESSAGE='กำลังอ่านข้อมูล Building Zone จาก Google Sheets';
let mappingRows=[];
function norm(s){return String(s??'').trim().replace(/\s+/g,' ').toLowerCase()}
function typeFor(point){
 const n=norm(point);
 const aliases=[['executive',/ผู้บริหาร/],['restroom',/ห้องน้ำ|สุขา|toilet|restroom/],['pantry',/pantry|ห้องอาหาร|โรงอาหาร/],['meeting',/ประชุม|meeting/],['office',/สำนักงาน|office/],['elevator',/ลิฟท์|ลิฟต์|elevator|lift/],['stairs',/บันไดหนีไฟ|fire stair/],['outdoor',/ภายนอกอาคาร|รอบตัวอาคาร/],['special',/พื้นที่พิเศษ|สักการะ/],['support',/สนับสนุนการปฏิบัติงาน/],['common',/ส่วนกลาง|common/]];
 const id=aliases.find(([,re])=>re.test(n))?.[0];
 return TYPES.find(t=>t.id===id)||null;
}
function stableId(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return 'bz'+(h>>>0).toString(36)}
function applyBuildingZones(rows){
 if(!Array.isArray(rows))throw Error('รูปแบบ Building Zone ไม่ถูกต้อง');
 const names=new Map(), uniques=new Set(), cleaned=[];
 for(const rec of rows){
  const building=String(rec.building??'').trim(),floor=String(rec.floor??'').trim(),zone=String(rec.zone??'').trim(),point=String(rec.point??'').trim();
  if(!building||!floor||!point)continue;
  const unique=[building,floor,zone,point].map(norm).join('|');

const DAILY_TZ='Asia/Bangkok';

function resizePhoto(file){return new Promise((resolve,reject)=>{const img=new Image();let uri=URL.createObjectURL(file);img.onload=()=>{let scale=Math.min(1,960/Math.max(img.width,img.height));let c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);let ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(uri);resolve(c.toDataURL('image/jpeg',.65))};img.onerror=()=>{URL.revokeObjectURL(uri);reject(Error('image'))};img.src=uri})}
function flatResults(entry){
 const definitions=entry.pointDefinitions || floorPoints(entry.building,entry.floor);
 return definitions.flatMap(t=>{
  const r=entry.areas?.[t.id];if(!r)return [];
  if(r.status)return [{...r,area:t.name,zone:t.zone||'',areaId:t.id,criterion:t.checks?.join(' / ')||'',criterionIndex:0}];
  return [];
 });
}

function finishFloor(){
 const points=floorPoints(),total=points.length;
 if(MAPPING_STATE!=='ready'||!total){notify('ยังไม่มีข้อมูล Mapping สำหรับชั้นนี้');return}

 const k=key(ui.building,ui.floor),draft=db.drafts[k];if(!draft)return;
 let record={...structuredClone(draft),id:'INSP-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),finishedAt:now(),inspector:inspectName(),buildingName:b().name,pointDefinitions:structuredClone(points)};
 db.completed.push(record);const results=flatResults(record);let problems=0;
 for(const r of results){
 if(r.status==='fail'){
   db.actions.push({id:'CL-'+Date.now().toString(36)+'-'+problems,inspectionId:record.id,building:record.building,floor:record.floor,area:r.area,zone:r.zone||'',buildingName:record.buildingName,criterion:r.criterion,inspector:record.inspector,note:r.note,before:r.before,after:r.after,status:'closed',resolved:true,createdAt:record.finishedAt,history:[{at:record.finishedAt,description:'ตรวจพบไม่ผ่านเกณฑ์'},{at:record.finishedAt,description:'ดำเนินการแก้ไขเรียบร้อยแล้ว (ยืนยันโดยผู้ตรวจ)'}]});problems++;
 }
 if(r.status==='repair'){
   const id='MTN-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6);
   db.tickets.push({id,inspectionId:record.id,building:record.building,floor:record.floor,area:r.area,zone:r.zone||'',buildingName:record.buildingName,criterion:r.criterion,inspector:record.inspector,note:r.note,before:r.before,after:'',status:'submitted',createdAt:record.finishedAt,history:[{at:record.finishedAt,description:'สร้างรายการแจ้งซ่อม (จำลอง ยังไม่ส่งถึง MTN จริง)'}]});problems++;
 }
 }
 delete db.drafts[k];db.logs.push({at:now(),description:`บันทึกผล ${b().name} ชั้น ${ui.floor} โดย ${record.inspector}`});
 if(save()){cloudPost({operation:'inspection',record,tickets:db.tickets.filter(t=>t.inspectionId===record.id),actions:db.actions.filter(t=>t.inspectionId===record.id)});ui.page='floors';render();notify('บันทึกในเครื่องแล้ว · กำลังส่ง Google Sheets (โปรดตรวจยืนยันที่ Sheet)')}
}

async function updateTicket(){let {obj:x}=selectedItem();if(!x)return;const status=$id('statusUpdate').value,note=$id('statusNote').value.trim(),file=$id('afterFile').files?.[0];if(status==='closed'&&!x.after&&!file){notify('กรุณาแนบรูปหลังแก้ไขก่อนปิดงาน');return}if(file){try{x.after=await resizePhoto(file)}catch(e){notify('ไม่สามารถอ่านรูปภาพ');return}}if(x.status===status&&!note&&!file){notify('ยังไม่มีข้อมูลเปลี่ยนแปลง');return}x.status=status;x.history.push({at:now(),description:`อัปเดตสถานะเป็น ${status.replace('inprogress','กำลังดำเนินการ').replace('verification','รอตรวจยืนยัน').replace('closed','ปิดงาน')}${note?' · '+note:''}`});if(save()){let {kind}=selectedItem();cloudPost({operation:'issue',kind,issue:x});render();notify('บันทึกในเครื่องแล้ว · กำลังส่ง Google Sheets')}}
function periodRecords(){let nowms=Date.now();let days=ui.period==='all'?Infinity:Number(ui.period);return db.completed.filter(x=>(ui.filterBuilding==='all'||sameBuilding(x,ui.filterBuilding))&&(nowms-new Date(x.finishedAt).getTime())<=days*86400000)}function periodTickets(){let ids=new Set(periodRecords().map(x=>x.id));return [...db.tickets.map(x=>({...x,kind:'repair'})),...db.actions.map(x=>({...x,kind:'clean'}))].filter(x=>ids.has(x.inspectionId))}function summary(){const rec=periodRecords(),results=rec.flatMap(flatResults),tk=periodTickets();return {rec,results,tk,pass:results.filter(r=>r.status==='pass').length,fail:results.filter(r=>r.status==='fail').length,repair:results.filter(r=>r.status==='repair').length,rate:results.length?Math.round(results.filter(r=>r.status==='pass').length/results.length*100):0}}

function makeReport(){let s=summary(),period=ui.period==='all'?'ทั้งหมด':ui.period+' วันล่าสุด',building=ui.filterBuilding==='all'?'ทุกอาคาร':BUILDINGS.find(x=>x.id===ui.filterBuilding)?.name;const rows=s.rec.slice().reverse().map(x=>{let r=flatResults(x);return `<tr><td>${esc((x.buildingName||(x.buildingName||BUILDINGS.find(b=>b.id===x.building)?.name||x.building)||x.building))} / ${esc(x.floor)}</td><td>${date(x.finishedAt)}</td><td>${esc(x.inspector)}</td><td>${r.filter(z=>z.status==='pass').length}</td><td>${r.filter(z=>z.status==='fail').length}</td><td>${r.filter(z=>z.status==='repair').length}</td></tr>`}).join('');$id('report').innerHTML=`<div class="rp-title"><h1>CleanSpace – สรุปผลตรวจความสะอาด</h1><div>${esc(building)} · ${esc(period)} · วันที่ออกรายงาน ${date(now())}</div></div><h2 style="margin-top:15px">ภาพรวม</h2><p>รอบตรวจ ${s.rec.length} | ผ่านเกณฑ์ ${s.pass} จุด | ไม่ผ่านเกณฑ์ ${s.fail} จุด | แจ้งซ่อม ${s.repair} จุด | อัตราผ่าน ${s.rate}%</p><h2 style="margin-top:15px">ประวัติรอบตรวจ</h2><table><thead><tr><th>อาคาร / ชั้น</th><th>วันที่</th><th>ผู้ตรวจ</th><th>ผ่าน</th><th>ไม่ผ่าน</th><th>แจ้งซ่อม</th></tr></thead><tbody>${rows||'<tr><td colspan="6">ไม่มีข้อมูล</td></tr>'}</tbody></table><h2>รายการติดตาม</h2><table><thead><tr><th>เลขที่</th><th>จุดตรวจ</th><th>ปัญหา</th><th>สถานะ</th></tr></thead><tbody>${s.tk.map(t=>`<tr><td>${esc(t.id)}</td><td>${esc(t.area)}</td><td>${esc(t.note)}</td><td>${t.status==='closed'?'ปิดแล้ว':'อยู่ระหว่างติดตาม'}</td></tr>`).join('')||'<tr><td colspan="4">ไม่มีรายการ</td></tr>'}</tbody></table><p style="margin-top:30px;font-size:10px">รายงานนี้สร้างจากข้อมูลล่าสุดใน Browser หลังการซิงก์ Google Sheets</p>`;window.print()}
render();
if(CLOUD_API_URL) setTimeout(loadCloud,300);else{MAPPING_STATE='error';MAPPING_MESSAGE='ยังไม่ได้ตั้งค่า Apps Script URL';render()}
</script></body></html>
